  <!-- RIGHT: shelf & dispensing (25%) -->
  <g transform="translate(972,42)">
    <rect width="296" height="666" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="14" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#67e8f9">Rak &amp; Dispensing</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
      <rect x="12" y="40" width="272" height="46" rx="4" fill="#1e293b"/><text x="22" y="60">🧴 Rak Blister Obat</text><text x="22" y="76" font-size="9" fill="#64748b">Pengambilan otomatis saat diterima</text>
      <rect x="12" y="94" width="272" height="46" rx="4" fill="#1e293b"/><text x="22" y="114">⚗️ Mortir &amp; Stamper</text><text x="22" y="130" font-size="9" fill="#64748b">Aktif untuk resep racikan puyer</text>
      <rect x="12" y="148" width="272" height="60" rx="4" fill="#1e293b"/><text x="22" y="168">🏷️ Dispenser Etiket</text>
      <rect x="22" y="178" width="70" height="18" rx="3" fill="#fff"/><text x="30" y="191" font-size="9" fill="#000">PUTIH · dalam</text>
      <rect x="100" y="178" width="60" height="18" rx="3" fill="#2563eb"/><text x="108" y="191" font-size="9" fill="#fff">BIRU · luar</text>
      <rect x="12" y="216" width="272" height="46" rx="4" fill="#1e293b"/><text x="22" y="236">🔔 Bel Interkom</text><text x="22" y="252" font-size="9" fill="#64748b">Salinan resep &amp; konfirmasi ke pasien</text>
