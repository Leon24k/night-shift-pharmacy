  <text x="16" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#67e8f9">APOTEK JAGA · SHIFT MALAM</text>
  <rect x="250" y="6" width="120" height="18" rx="3" fill="#6b21a8"/>
  <text x="310" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f3e8ff">⚡ Waspada LASA</text>
  <text x="720" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Hari 3</text>
  <text x="790" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Pasien 2/5</text>
  <text x="880" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Aturan: R1 R2 R3 R4</text>
  <text x="1040" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#86efac">Kas: Rp 620.000</text>
  <text x="1190" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#86efac">Rep 96</text>

