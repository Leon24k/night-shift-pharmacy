        <text x="14" y="48" font-size="10">Puskesmas Melati</text>
        <text x="14" y="63" font-size="10">SIP: SIP.446/1874/DINKES/2022</text>
        <text x="14" y="78" font-size="10">Tanggal: 2026-09-28</text>
        <line x1="10" y1="86" x2="220" y2="86" stroke="#00000050"/>
        <text x="14" y="118" font-size="15" font-style="italic" font-weight="700">R/</text>
        <text x="40" y="118" font-size="14">Asam Mefenamat 500mg</text>
        <text x="40" y="136" font-size="13">No. XV</text>
        <text x="40" y="156" font-size="12" font-style="italic">S 3 dd tab 1 p.c.</text>
        <text x="40" y="174" font-size="12" font-style="italic" fill="#4b5563">— paraf —</text>
        <line x1="10" y1="286" x2="220" y2="286" stroke="#00000050"/>
        <text x="14" y="306" font-size="11" font-weight="700">Pro: Dewi Lestari</text>
        <text x="14" y="322" font-size="11">Umur: 34 th</text>
      </g>
    </g>

    <!-- stamps -->
    <g transform="translate(150,430)">
      <rect x="0" y="0" width="96" height="56" rx="3" fill="#15803d" stroke="#14532d" stroke-width="3"/>
      <text x="48" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#fff">TERIMA</text>
      <text x="48" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">[A]</text>
      <rect x="136" y="0" width="96" height="56" rx="3" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3"/>
      <text x="184" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#fff">TOLAK</text>
      <text x="184" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">[D]</text>
