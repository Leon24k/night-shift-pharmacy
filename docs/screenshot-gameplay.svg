    <text x="16" y="250" font-family="monospace" font-size="10" font-weight="700" fill="#b91c1c">[ ! ] STATUS INTERAKSI</text>
    <text x="16" y="266" font-family="monospace" font-size="9" fill="#000">Tidak ada interaksi mayor terdeteksi.</text>
    <text x="16" y="279" font-family="monospace" font-size="9" fill="#000">Cocokkan keluhan pasien dengan indikasi obat (R4).</text>
    <!-- ped dose calc -->
