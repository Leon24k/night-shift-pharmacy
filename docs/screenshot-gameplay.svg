      <rect x="110" y="30" width="96" height="18" fill="#c0c0c0" stroke="#808080"/><text x="116" y="43">F2: Formularium</text>
      <rect x="210" y="30" width="80" height="18" fill="#c0c0c0" stroke="#808080"/><text x="216" y="43">F3: Cek Stok</text>
      <rect x="294" y="30" width="90" height="18" fill="#c0c0c0" stroke="#808080"/><text x="300" y="43">F4: Master SIP</text>
    </g>
    <!-- patient bar -->
    <rect x="10" y="52" width="404" height="18" fill="#c0c0c0" stroke="#808080"/>
    <text x="14" y="65" font-family="monospace" font-size="10" fill="#000">Pasien: Dewi Lestari   Usia: 34 th   BB: -</text>
