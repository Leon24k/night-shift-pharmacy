      <text x="16" y="106" fill="#000">MEF500 Asam Mefenamat 500mg</text>
      <rect x="250" y="97" width="70" height="12" rx="2" fill="#b91c1c"/><text x="255" y="106" fill="#fff">KERAS</text>
      <text x="330" y="106" fill="#000">15   1500 mg</text>
      <text x="16" y="126" fill="#b45309">⚠ LASA — mirip Asam Traneksamat</text>
