<svg width="640" height="240" viewBox="0 0 640 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apotek Jaga: Shift Malam logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="240" rx="18" fill="url(#bg)"/>

  <!-- acrylic glass scratches -->
  <g opacity="0.08" stroke="#e2e8f0" stroke-width="2">
    <line x1="40" y1="10" x2="120" y2="60"/>
    <line x1="500" y1="20" x2="600" y2="90"/>
    <line x1="60" y1="200" x2="180" y2="150"/>
  </g>

  <!-- mortar & pestle emblem -->
  <g transform="translate(96,120)" filter="url(#glow)">
    <!-- pestle -->
    <rect x="26" y="-58" width="12" height="60" rx="6" fill="url(#neon)" transform="rotate(20 32 -28)"/>
    <!-- mortar bowl -->
    <path d="M -44 -6 A 44 30 0 0 0 44 -6 L 34 30 A 34 20 0 0 1 -34 30 Z" fill="none" stroke="url(#neon)" stroke-width="6"/>
    <ellipse cx="0" cy="-6" rx="44" ry="14" fill="none" stroke="url(#neon)" stroke-width="6"/>
    <!-- medical cross -->
    <g transform="translate(0,6)">
      <rect x="-6" y="-14" width="12" height="28" rx="3" fill="#22d3ee"/>
      <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#22d3ee"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="196" y="108" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#22d3ee" filter="url(#glow)">APOTEK JAGA</text>
  <text x="198" y="150" font-family="'Courier New', monospace" font-size="26" letter-spacing="12" fill="#5eead4">SHIFT MALAM</text>
  <text x="200" y="192" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#64748b">Pharmacy Verification &amp; Dispensing Sim</text>
</svg>
