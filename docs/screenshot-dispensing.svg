<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apotek Jaga dispensing and compounding">
  <defs>
    <radialGradient id="mortar" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e5e7eb"/><stop offset="55%" stop-color="#9ca3af"/><stop offset="1" stop-color="#6b7280"/>
    </radialGradient>
    <radialGradient id="pestle" cx="40%" cy="30%" r="70%">
      <stop offset="0" stop-color="#f9fafb"/><stop offset="70%" stop-color="#d1d5db"/><stop offset="1" stop-color="#9ca3af"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="#05070d"/>
  <rect width="1280" height="720" fill="#000" opacity="0.5"/>

  <!-- modal -->
  <g transform="translate(390,150)">
    <rect width="500" height="440" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <text x="30" y="46" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#fcd34d">⚗️ Racik Puyer</text>
    <text x="30" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Resep racikan 10 bungkus. Tekan &amp; putar kursor</text>
    <text x="30" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">memutar di dalam mortir untuk menghaluskan tablet.</text>

    <!-- mortar -->
    <g transform="translate(250,230)">
      <circle r="96" fill="url(#mortar)"/>
      <circle r="96" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
      <circle cx="40" cy="0" r="40" fill="url(#pestle)" transform="rotate(210)"/>
      <text x="-14" y="10" font-size="34">🥣</text>
      <!-- rotation arrow -->
      <path d="M -70 0 A 70 70 0 1 1 0 70" fill="none" stroke="#fcd34d" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
      <path d="M 0 70 l -8 -12 l 16 0 z" fill="#fcd34d" opacity="0.7"/>
    </g>

    <!-- progress -->
    <rect x="30" y="360" width="440" height="14" rx="7" fill="#334155"/>
    <rect x="30" y="360" width="290" height="14" rx="7" fill="#f59e0b"/>
    <text x="30" y="394" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Kehalusan: 66%</text>
  </g>

  <!-- etiket chips -->
  <g transform="translate(940,300)">
    <text x="0" y="-16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#67e8f9">Etiket</text>
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#fff"/>
    <text x="12" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#000">ETIKET PUTIH</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Obat dalam / oral</text>
    <text x="12" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Puyer racikan · 3x sehari</text>
    <rect x="0" y="86" width="150" height="70" rx="6" fill="#2563eb"/>
    <text x="12" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">ETIKET BIRU</text>
    <text x="12" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#dbeafe">Obat luar / topikal</text>
  </g>
</svg>
