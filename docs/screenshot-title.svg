<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apotek Jaga title screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="38%" r="50%">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#halo)"/>

  <!-- acrylic scratches -->
  <g opacity="0.06" stroke="#e2e8f0" stroke-width="2">
    <line x1="80" y1="40" x2="260" y2="180"/>
    <line x1="1000" y1="60" x2="1200" y2="240"/>
    <line x1="120" y1="640" x2="360" y2="520"/>
    <line x1="900" y1="660" x2="1180" y2="560"/>
  </g>

  <!-- emblem -->
  <g transform="translate(640,210) scale(1.4)" filter="url(#glow)">
    <rect x="26" y="-58" width="12" height="60" rx="6" fill="url(#neon)" transform="rotate(20 32 -28)"/>
    <path d="M -44 -6 A 44 30 0 0 0 44 -6 L 34 30 A 34 20 0 0 1 -34 30 Z" fill="none" stroke="url(#neon)" stroke-width="6"/>
    <ellipse cx="0" cy="-6" rx="44" ry="14" fill="none" stroke="url(#neon)" stroke-width="6"/>
    <g transform="translate(0,6)">
      <rect x="-6" y="-14" width="12" height="28" rx="3" fill="#67e8f9"/>
      <rect x="-14" y="-6" width="28" height="12" rx="3" fill="#67e8f9"/>
    </g>
  </g>

  <text x="640" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="800" fill="#67e8f9" filter="url(#glow)">APOTEK JAGA</text>
  <text x="640" y="452" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" letter-spacing="18" fill="#5eead4">SHIFT MALAM</text>
  <text x="640" y="512" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#94a3b8">Verify prescriptions. Keep patients safe. Protect your license.</text>

  <!-- start button -->
  <g transform="translate(640,580)">
    <rect x="-110" y="-26" width="220" height="52" rx="4" fill="#c0c0c0"/>
    <rect x="-110" y="-26" width="220" height="52" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">▶  MULAI SHIFT</text>
  </g>
  <text x="640" y="650" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#475569">Educational build · 100% client-side · works offline</text>
</svg>
